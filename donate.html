<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="robots" content="noindex" />
<title>Tip Jiffy 💕</title>
<link rel="canonical" href="https://jiffys.info/tip" />
<!--
  The tip jar moved from /donate to /tip. This page only exists so the old
  address keeps working: QR codes, chat commands, pinned messages and — most
  importantly — the return URLs of payments that were STARTED before the move
  still land here.

  So the query string and hash have to survive the hop: a Stripe or
  NOWPayments return carries ?thanks=1 / ?paid=1 / ?payment_intent=... and the
  tip page reads them to show "thank you" instead of a blank form. The <meta
  refresh> below is the no-JS fallback and cannot carry them, which is why the
  script runs first.
-->
<script>
  (function () {
    try {
      var to = '/tip' + (location.search || '') + (location.hash || '');
      location.replace(to);          // replace, so Back does not bounce
    } catch (e) { location.href = '/tip'; }
  })();
</script>
<meta http-equiv="refresh" content="0; url=/tip" />
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100svh;display:grid;place-items:center;
       background:#fbe1e8;color:#5a2740;
       font:16px/1.5 "Quicksand",system-ui,sans-serif;text-align:center;padding:24px}
  @media (prefers-color-scheme:dark){body{background:#1a0f16;color:#f6dbe6}}
  a{display:inline-block;margin-top:14px;padding:14px 22px;border-radius:14px;
    background:#e0588f;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <div>
    <p>The tip jar moved to <strong>jiffys.info/tip</strong> — taking you there…</p>
    <a href="/tip">Go to the tip jar 💕</a>
  </div>
</body>
</html>
