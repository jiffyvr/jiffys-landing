<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening…</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100svh;display:grid;place-items:center;
       background:#fbe1e8;color:#5a2740;
       font:16px/1.5 "Quicksand",system-ui,sans-serif;text-align:center;padding:24px}
  @media (prefers-color-scheme:dark){body{background:#1a0f16;color:#f6dbe6}}
  .card{max-width:420px}
  h1{font-size:20px;margin:0 0 6px}
  p{margin:0 0 20px;opacity:.75;font-size:14px}
  a.go{display:block;padding:16px 20px;border-radius:14px;background:#e0588f;
       color:#fff;text-decoration:none;font-weight:700;font-size:18px}
  a.go:active{transform:scale(.99)}
  .small{display:block;margin-top:14px;font-size:13px;opacity:.6;color:inherit}
</style>
<div class="card">
  <h1 id="h">Opening the stream…</h1>
  <p id="sub">If it doesn't jump on its own, tap below.</p>
  <a class="go" id="go" href="#">▶ Watch on Kick</a>
  <a class="small" id="home" href="/">back to jiffys.info</a>
</div>
<script>
/* A notificationclick has no user gesture, so iOS/Android skip their
   Universal/App Link check and openWindow() lands here inside the PWA.
   This page re-issues the navigation; on iOS the automatic attempt is
   often refused, which is why the tap target is the real product and
   the auto-attempt is only a bonus. */
(function () {
  var p = new URLSearchParams(location.search);
  var to = p.get('to') || '';
  if (!/^https?:\/\//i.test(to)) to = 'https://kick.com/jiffyvr';

  var a = document.getElementById('go');
  a.href = to;
  try { a.textContent = '▶ Watch on ' + new URL(to).hostname.replace(/^www\./, ''); }
  catch (e) {}

  // immediate top-level attempt (works on Android/desktop)
  try { location.replace(to); } catch (e) {}

  // if we're still here a moment later, the browser refused it: make the
  // tap obvious instead of pretending something is happening
  setTimeout(function () {
    document.getElementById('h').textContent = 'Tap to watch';
    document.getElementById('sub').textContent = 'Your browser blocked the automatic jump.';
  }, 1200);
})();
</script>
